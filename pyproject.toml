[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "principal-manifold"
version = "0.1.0"
description = "Principal curves, elastic graphs, and principal manifold utilities."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
    "pillow",
]

[project.optional-dependencies]
accel = ["numba"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
